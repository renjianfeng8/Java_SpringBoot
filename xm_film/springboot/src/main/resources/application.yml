# 仅本机运行：所有配置直接写死，不经环境变量注入。
server:
  port: 9090  # 后端接口端口，只提供 /api/v1/** 的 JSON；前端页面访问端口见 vue/vite.config.js 的 server.port

spring:
  datasource:
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xm-film?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    com.example.springboot.mapper: DEBUG

cors:
  allowed-origins: http://localhost:5173

jwt:
  # 键名刻意不叫 secret —— 本机存在用户级环境变量 JWT_SECRET（属于另一个项目，不可动），
  # Spring 的宽松绑定会把它映射到 jwt.secret，而环境变量优先级高于本文件，
  # 于是这行会被静默覆盖、形同虚设。改名成 signing-key 后本文件才是唯一来源。
  # 再改回 secret 就会复现该问题；改名的代价是换密钥、旧令牌失效需重新登录。
  signing-key: xm-film-secret-key-2024-springboot-vue3-jwt-auth
  expire: 86400000

file:
  upload-dir: "D:/project/picture"
  access-prefix: http://localhost:9090/files/

