# 仅本机运行：所有配置直接写死，不经环境变量注入（不部署）。
server:
  port: 9090  # 后端接口端口，只提供 /api/v1/** 的 JSON；前端页面访问端口见 vue/vite.config.js 的 server.port

spring:
  datasource:
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xm-film?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    com.example.springboot.mapper: DEBUG

cors:
  allowed-origins: http://localhost:5173

jwt:
  secret: xm-film-secret-key-2024-springboot-vue3-jwt-auth
  expire: 86400000

file:
  upload-dir: "D:/project/picture"
  access-prefix: http://localhost:9090/files/
